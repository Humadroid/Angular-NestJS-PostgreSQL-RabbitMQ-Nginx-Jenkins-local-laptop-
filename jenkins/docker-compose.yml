services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: local-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Docker CLI talks to the host daemon. Compose build contexts are sent to it.
    environment:
      # disabled-for-polling lets the local pre-push hook call /git/notifyCommit without
      # credentials, but Jenkins only polls SCM in response. It cannot be asked to build a
      # caller-supplied commit.
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Dhudson.plugins.git.GitStatus.NOTIFY_COMMIT_ACCESS_CONTROL=disabled-for-polling"

volumes:
  jenkins_home:
